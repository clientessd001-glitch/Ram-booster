name: Gerar APK RAM Booster Pro v4 RAM Calc

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Preparar ambiente do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK Oficial
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest/*
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools

          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 4. Criar estrutura do projeto Kotlin v4.0
        run: |
          mkdir -p app/src/main/java/com/rambooster/pro
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RamBoosterPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rambooster.pro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rambooster.pro"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "4.0-RAM-CALC"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">RAM Booster Calc</string>
              <string name="accessibility_desc">Automatiza a hibernação de aplicativos pesados em segundo plano.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="80" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.CLEAR_APP_CACHE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              
              <!-- Permissão exclusiva para a Bolha Flutuante estilo RAM Calc -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Serviço da Bolha Flutuante sobre Jogos -->
                  <service
                      android:name=".FloatingCalcService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".AutoBoosterService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".HibernatorAccessibilityService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="RAM Booster - Motor Hibernador"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/rambooster/pro/MainActivity.kt
          package com.rambooster.pro

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.app.ActivityManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import java.io.RandomAccessFile
          import kotlin.math.roundToInt
          
          import android.graphics.Color as ViewColor
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.LinearLayout
          import android.graphics.drawable.GradientDrawable

          // =========================================================================
          // SERVIÇO DE BOLHA FLUTUANTE (ESTILO RAM CALC) - ZERO USO DE CPU
          // =========================================================================
          class FloatingCalcService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingView: LinearLayout? = null
              private val serviceScope = CoroutineScope(Dispatchers.Main + Job())
              private var updateJob: Job? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  
                  // Cria o visual da Bolha Oval Flutuante (Nativo = 0 Lag)
                  floatingView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      val shape = GradientDrawable()
                      shape.shape = GradientDrawable.OVAL
                      shape.setColor(ViewColor.parseColor("#E6090D16")) // Preto translúcido
                      shape.setStroke(6, ViewColor.parseColor("#00E676")) // Borda Verde neon
                      background = shape
                      
                      val padding = (resources.displayMetrics.density * 20).toInt()
                      setPadding(padding, padding, padding, padding)
                      elevation = 10f
                  }
                  
                  val ramText = TextView(this).apply {
                      text = "RAM"
                      setTextColor(ViewColor.parseColor("#00E676"))
                      textSize = 14f
                      setTypeface(null, android.graphics.Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  floatingView?.addView(ramText)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) 
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY 
                      else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 20
                  params.y = 200

                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  var isMoved = false

                  floatingView?.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isMoved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) isMoved = true
                              params.x = initialX + dx
                              params.y = initialY + dy
                              windowManager?.updateViewLayout(floatingView, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isMoved) {
                                  // Click! Otimiza por cima de tudo
                                  ramText.text = "Limpando.."
                                  ramText.setTextColor(ViewColor.parseColor("#38BDF8"))
                                  serviceScope.launch(Dispatchers.IO) {
                                      val before = readRealHardwareRam(this@FloatingCalcService).availRealMb
                                      executeDeepRamClean(this@FloatingCalcService)
                                      delay(400)
                                      val after = readRealHardwareRam(this@FloatingCalcService).availRealMb
                                      val freed = (after - before).coerceAtLeast(0)
                                      withContext(Dispatchers.Main) {
                                          ramText.text = "+$freed MB"
                                          ramText.setTextColor(ViewColor.parseColor("#FBBF24"))
                                          delay(2000)
                                          updateRamText(ramText)
                                      }
                                  }
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  windowManager?.addView(floatingView, params)
                  startRamMonitor(ramText)
              }

              private fun startRamMonitor(textView: TextView) {
                  updateJob?.cancel()
                  updateJob = serviceScope.launch {
                      while (isActive) {
                          updateRamText(textView)
                          delay(3500)
                      }
                  }
              }

              private fun updateRamText(textView: TextView) {
                  val ram = readRealHardwareRam(this@FloatingCalcService)
                  val percent = if (ram.totalRealMb > 0) ((ram.usedActiveMb.toFloat() / ram.totalRealMb.toFloat()) * 100).toInt() else 0
                  textView.text = "$percent%\nRAM"
                  textView.setTextColor(if (percent > 85) ViewColor.parseColor("#EF4444") else ViewColor.parseColor("#00E676"))
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
                  floatingView?.let { windowManager?.removeView(it) }
              }
          }

          object BoosterState {
              private val _isServiceRunning = MutableStateFlow(false)
              val isServiceRunning = _isServiceRunning.asStateFlow()

              private val _intervalSeconds = MutableStateFlow(30)
              val intervalSeconds = _intervalSeconds.asStateFlow()

              private val _remainingSeconds = MutableStateFlow(30)
              val remainingSeconds = _remainingSeconds.asStateFlow()

              private val _cyclesCount = MutableStateFlow(0)
              val cyclesCount = _cyclesCount.asStateFlow()

              private val _totalFreedMb = MutableStateFlow(0L)
              val totalFreedMb = _totalFreedMb.asStateFlow()

              private val _statusMessage = MutableStateFlow("Motor RAM Calc v4 pronto.")
              val statusMessage = _statusMessage.asStateFlow()

              private val _isHibernating = MutableStateFlow(false)
              val isHibernating = _isHibernating.asStateFlow()

              private val _autoForceStopOnTimer = MutableStateFlow(false)
              val autoForceStopOnTimer = _autoForceStopOnTimer.asStateFlow()

              private val _autoCleanOnScreenOff = MutableStateFlow(true)
              val autoCleanOnScreenOff = _autoCleanOnScreenOff.asStateFlow()

              private val _selectedPackages = MutableStateFlow<Set<String>>(emptySet())
              val selectedPackages = _selectedPackages.asStateFlow()

              @Volatile
              var stepCompletedForCurrentApp: Boolean = false
              @Volatile
              var clickedForceStopWaitingDialog: Boolean = false

              fun setServiceRunning(running: Boolean) { _isServiceRunning.value = running }
              fun setHibernating(active: Boolean) { _isHibernating.value = active }
              fun setAutoForceStopOnTimer(enabled: Boolean) { _autoForceStopOnTimer.value = enabled }
              fun setAutoCleanOnScreenOff(enabled: Boolean) { _autoCleanOnScreenOff.value = enabled }
              fun setSelectedPackages(pkgs: Set<String>) { _selectedPackages.value = pkgs }

              fun updateInterval(seconds: Int) {
                  val safeSec = seconds.coerceIn(5, 600)
                  _intervalSeconds.value = safeSec
                  _remainingSeconds.value = safeSec
              }
              fun updateRemaining(seconds: Int) { _remainingSeconds.value = seconds }
              fun recordCycle(freedMb: Long, killedApps: Int) {
                  _cyclesCount.value += 1
                  _totalFreedMb.value += freedMb
                  _statusMessage.value = "Auto Ciclo #${_cyclesCount.value}: +$freedMb MB livres ($killedApps pacotes)."
              }
              fun setStatus(msg: String) { _statusMessage.value = msg }
          }

          class HibernatorAccessibilityService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!BoosterState.isHibernating.value) return
                  val rootNode = rootInActiveWindow ?: return
                  try {
                      val cancelButtons = findNodesByKeywords(rootNode, listOf("cancelar", "cancel"))
                      if (cancelButtons.isNotEmpty() || BoosterState.clickedForceStopWaitingDialog) {
                          val confirmNodes = findNodesByKeywords(rootNode, listOf("ok", "forçar parada", "forçar interrupção", "force stop", "sim", "encerrar"))
                          val okById = rootNode.findAccessibilityNodeInfosByViewId("android:id/button1")
                          for (node in (okById + confirmNodes).distinct()) {
                              if (clickNodeOrParent(node)) {
                                  BoosterState.clickedForceStopWaitingDialog = false
                                  BoosterState.stepCompletedForCurrentApp = true
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  return
                              }
                          }
                      }
                      val forceStopNodes = findNodesByKeywords(rootNode, listOf("forçar parada", "forçar interrupção", "force stop", "forçar fechamento", "encerrar"))
                      val byIdRight = rootNode.findAccessibilityNodeInfosByViewId("com.android.settings:id/right_button")
                      val byIdForce = rootNode.findAccessibilityNodeInfosByViewId("com.android.settings:id/force_stop_button")
                      for (node in (forceStopNodes + byIdRight + byIdForce).distinct()) {
                          if (!node.isEnabled) {
                              BoosterState.stepCompletedForCurrentApp = true
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              return
                          }
                          if (clickNodeOrParent(node)) {
                              BoosterState.clickedForceStopWaitingDialog = true
                              return
                          }
                      }
                  } catch (_: Exception) {}
              }
              private fun findNodesByKeywords(root: AccessibilityNodeInfo, keywords: List<String>): List<AccessibilityNodeInfo> {
                  val results = mutableListOf<AccessibilityNodeInfo>()
                  for (kw in keywords) {
                      root.findAccessibilityNodeInfosByText(kw)?.forEach { item ->
                          val text = item.text?.toString()?.lowercase()?.trim() ?: ""
                          val desc = item.contentDescription?.toString()?.lowercase()?.trim() ?: ""
                          if (text == kw || desc == kw || text.contains(kw)) results.add(item)
                      }
                  }
                  return results
              }
              private fun clickNodeOrParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  var depth = 0
                  while (current != null && depth < 5) {
                      if (current.isClickable && current.isEnabled) return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      current = current.parent
                      depth++
                  }
                  return false
              }
              override fun onInterrupt() {}
          }

          class AutoBoosterService : Service() {
              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private var timerJob: Job? = null
              private val screenOffReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_SCREEN_OFF && BoosterState.autoCleanOnScreenOff.value) {
                          serviceScope.launch {
                              val beforeAvail = readRealHardwareRam(this@AutoBoosterService).availRealMb
                              val killed = executeDeepRamClean(this@AutoBoosterService)
                              delay(400L)
                              val afterRam = readRealHardwareRam(this@AutoBoosterService)
                              BoosterState.recordCycle((afterRam.availRealMb - beforeAvail).coerceAtLeast(0L), killed)
                          }
                      }
                  }
              }

              companion object {
                  const val CHANNEL_ID = "auto_ram_booster_v4_channel"
                  const val NOTIFICATION_ID = 1006
                  const val ACTION_START = "ACTION_START_BOOSTER"
                  const val ACTION_STOP = "ACTION_STOP_BOOSTER"
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopBoosterService()
                      return START_NOT_STICKY
                  }
                  BoosterState.setServiceRunning(true)
                  val ram = readRealHardwareRam(this)
                  val notif = buildNotification(((ram.usedActiveMb.toFloat() / ram.totalRealMb.toFloat()) * 100).roundToInt(), BoosterState.intervalSeconds.value, BoosterState.cyclesCount.value, BoosterState.totalFreedMb.value)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(NOTIFICATION_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC) else startForeground(NOTIFICATION_ID, notif)
                  startAutoLoop()
                  return START_STICKY
              }

              private fun startAutoLoop() {
                  timerJob?.cancel()
                  timerJob = serviceScope.launch {
                      BoosterState.updateRemaining(BoosterState.intervalSeconds.value)
                      while (isActive && BoosterState.isServiceRunning.value) {
                          delay(1000L)
                          if (BoosterState.isHibernating.value) continue
                          val nextSec = BoosterState.remainingSeconds.value - 1
                          if (nextSec <= 0) {
                              val pkgs = BoosterState.selectedPackages.value.toList()
                              if (BoosterState.autoForceStopOnTimer.value && isAccessibilityServiceEnabled(this@AutoBoosterService) && pkgs.isNotEmpty()) {
                                  runAutomatedHibernation(this@AutoBoosterService, pkgs, returnToApp = false)
                              } else {
                                  val beforeAvail = readRealHardwareRam(this@AutoBoosterService).availRealMb
                                  val killed = executeDeepRamClean(this@AutoBoosterService)
                                  delay(400L)
                                  val afterRam = readRealHardwareRam(this@AutoBoosterService)
                                  BoosterState.recordCycle((afterRam.availRealMb - beforeAvail).coerceAtLeast(0L), killed)
                              }
                              BoosterState.updateRemaining(BoosterState.intervalSeconds.value)
                              val ram = readRealHardwareRam(this@AutoBoosterService)
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.notify(NOTIFICATION_ID, buildNotification(((ram.usedActiveMb.toFloat() / ram.totalRealMb.toFloat()) * 100).roundToInt(), BoosterState.intervalSeconds.value, BoosterState.cyclesCount.value, BoosterState.totalFreedMb.value))
                          } else {
                              BoosterState.updateRemaining(nextSec)
                          }
                      }
                  }
              }

              private fun stopBoosterService() {
                  BoosterState.setServiceRunning(false)
                  BoosterState.setStatus("Auto Booster desativado.")
                  timerJob?.cancel()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun buildNotification(ramPercent: Int, intervalSec: Int, cycles: Int, freedMb: Long): Notification {
                  val intent = Intent(this, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP }
                  val pIntent = PendingIntent.getActivity(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stopIntent = Intent(this, AutoBoosterService::class.java).apply { action = ACTION_STOP }
                  val pStop = PendingIntent.getService(this, 1, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setContentTitle("RAM Booster Turbo (${intervalSec}s)")
                      .setContentText("RAM: $ramPercent% | Total Liberado: +$freedMb MB")
                      .setOnlyAlertOnce(true)
                      .setOngoing(true)
                      .setContentIntent(pIntent)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Desligar", pStop)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(NotificationChannel(CHANNEL_ID, "Serviço Auto Booster", NotificationManager.IMPORTANCE_LOW).apply { setShowBadge(false) })
                  }
              }

              override fun onDestroy() {
                  try { unregisterReceiver(screenOffReceiver) } catch (_: Exception) {}
                  BoosterState.setServiceRunning(false)
                  serviceScope.cancel()
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF00E676), secondary = Color(0xFF38BDF8), background = Color(0xFF090D16), surface = Color(0xFF131B2E))) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              RamBoosterTurboScreen(context = this)
                          }
                      }
                  }
              }
          }

          data class RealHardwareRam(val commercialGb: Int, val totalRealMb: Long, val usedActiveMb: Long, val availRealMb: Long, val usedWithCacheMb: Long, val cachedAndBuffersMb: Long, val freeRawMb: Long)
          data class AppProcessItem(val appName: String, val packageName: String, val isRunningOrHeavy: Boolean)

          @Composable
          fun RamBoosterTurboScreen(context: Context) {
              val scope = rememberCoroutineScope()
              var ramData by remember { mutableStateOf(readRealHardwareRam(context)) }
              var isOptimizing by remember { mutableStateOf(false) }
              var isAccessibilityOn by remember { mutableStateOf(isAccessibilityServiceEnabled(context)) }

              val autoBoosterEnabled by BoosterState.isServiceRunning.collectAsState()
              val intervalSeconds by BoosterState.intervalSeconds.collectAsState()
              val remainingSeconds by BoosterState.remainingSeconds.collectAsState()
              val autoCyclesCount by BoosterState.cyclesCount.collectAsState()
              val totalFreedAccumulatedMb by BoosterState.totalFreedMb.collectAsState()
              val statusText by BoosterState.statusMessage.collectAsState()
              val isHibernating by BoosterState.isHibernating.collectAsState()
              val selectedPackages by BoosterState.selectedPackages.collectAsState()

              var userApps by remember { mutableStateOf<List<AppProcessItem>>(emptyList()) }
              val notifLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { _ -> toggleForegroundService(context, true) }

              LaunchedEffect(Unit) {
                  val loaded = loadUserInstalledApps(context)
                  userApps = loaded
                  if (selectedPackages.isEmpty()) BoosterState.setSelectedPackages(loaded.take(6).map { it.packageName }.toSet())
                  while (true) {
                      if (!isOptimizing && !isHibernating) {
                          ramData = readRealHardwareRam(context)
                          isAccessibilityOn = isAccessibilityServiceEnabled(context)
                      }
                      delay(2000L)
                  }
              }

              val usagePercent = if (ramData.totalRealMb > 0) ((ramData.usedActiveMb.toFloat() / ramData.totalRealMb.toFloat()) * 100f).coerceIn(1f, 99f) else 0f
              val gaugeColor = when { usagePercent >= 80f -> Color(0xFFFF5252); usagePercent >= 65f -> Color(0xFFFFAB00); else -> Color(0xFF00E676) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Text(text = "RAM BOOSTER CALC EDITION", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.ExtraBold)
                      Text(text = "Hardware: ${ramData.commercialGb} GB (${ramData.totalRealMb} MB)", color = Color(0xFF94A3B8), fontSize = 12.sp)
                  }

                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(20.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.fillMaxWidth().padding(18.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceAround) {
                                  Box(contentAlignment = Alignment.Center) {
                                      CircularProgressIndicator(progress = { usagePercent / 100f }, modifier = Modifier.size(110.dp), strokeWidth = 12.dp, color = gaugeColor, trackColor = Color(0xFF090D16))
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text(text = "${usagePercent.roundToInt()}%", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.ExtraBold)
                                          Text(text = "RAM Ativa", color = Color(0xFF94A3B8), fontSize = 10.sp)
                                      }
                                  }
                                  Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                      RamMetricRow("Em Uso Real:", "${ramData.usedActiveMb} MB", Color(0xFF38BDF8))
                                      RamMetricRow("Livre Agora:", "${ramData.availRealMb} MB", Color(0xFF00E676))
                                      RamMetricRow("Cache Sistema:", "${ramData.cachedAndBuffersMb} MB", Color(0xFFFBBF24))
                                  }
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              Text(text = statusText, color = Color(0xFFE2E8F0), fontSize = 12.sp, fontWeight = FontWeight.Medium)
                          }
                      }
                  }

                  // NOVO: CARD BOLHA FLUTUANTE (RAM CALC)
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF172036)), shape = RoundedCornerShape(20.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.fillMaxWidth().padding(18.dp)) {
                              Text("Modo RAM Calc (Bolha Flutuante)", color = Color(0xFF38BDF8), fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text("Limpe a RAM com 1 toque por cima de jogos e outros aplicativos.", color = Color(0xFF94A3B8), fontSize = 11.sp)
                              Spacer(modifier = Modifier.height(12.dp))
                              
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(
                                      onClick = {
                                          if (!Settings.canDrawOverlays(context)) {
                                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${context.packageName}"))
                                              context.startActivity(intent)
                                          } else {
                                              context.startService(Intent(context, FloatingCalcService::class.java))
                                          }
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF38BDF8)),
                                      shape = RoundedCornerShape(12.dp),
                                      modifier = Modifier.weight(1f).height(46.dp)
                                  ) {
                                      Text("ATIVAR BOLHA", color = Color(0xFF082F49), fontSize = 12.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                                  
                                  Button(
                                      onClick = { context.stopService(Intent(context, FloatingCalcService::class.java)) },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFEF4444)),
                                      shape = RoundedCornerShape(12.dp),
                                      modifier = Modifier.weight(1f).height(46.dp)
                                  ) {
                                      Text("REMOVER BOLHA", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                              }
                          }
                      }
                  }

                  // HIBERNAÇÃO PROFUNDA (ACESSIBILIDADE)
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF172036)), shape = RoundedCornerShape(20.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.fillMaxWidth().padding(18.dp)) {
                              Text(text = "Hibernação Profunda", color = Color(0xFF00E676), fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(text = if (isAccessibilityOn) "Motor ativo! Fechará os apps selecionados abaixo à força." else "Ative o serviço para clicar em 'Forçar Parada' automaticamente.", color = Color(0xFF94A3B8), fontSize = 11.sp)
                              Spacer(modifier = Modifier.height(10.dp))
                              if (!isAccessibilityOn) {
                                  Button(onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFF59E0B)), modifier = Modifier.fillMaxWidth().height(48.dp)) {
                                      Text("ATIVAR ACESSIBILIDADE (1 VEZ)", color = Color(0xFF451A03), fontSize = 13.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                              } else {
                                  Button(onClick = {
                                      if (selectedPackages.isNotEmpty()) scope.launch { runAutomatedHibernation(context, selectedPackages.toList(), true); ramData = readRealHardwareRam(context) }
                                  }, enabled = !isHibernating, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676)), modifier = Modifier.fillMaxWidth().height(50.dp)) {
                                      Text(if (isHibernating) "HIBERNANDO..." else "HIBERNAR ${selectedPackages.size} APPS AGORA", color = Color(0xFF052E16), fontSize = 13.sp, fontWeight = FontWeight.ExtraBold)
                                  }
