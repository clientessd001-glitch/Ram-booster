                  }

                  item {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text(text = "Apps para Hibernar (${selectedPackages.size}/${userApps.size})", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          TextButton(onClick = { BoosterState.setSelectedPackages(userApps.map { it.packageName }.toSet()) }) { Text("Todos", color = Color(0xFF38BDF8)) }
                      }
                  }

                  items(userApps) { app ->
                      val isChecked = selectedPackages.contains(app.packageName)
                      Card(colors = CardDefaults.cardColors(containerColor = if (isChecked) Color(0xFF1A263D) else MaterialTheme.colorScheme.surface), shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth().clickable { BoosterState.setSelectedPackages(if (isChecked) selectedPackages - app.packageName else selectedPackages + app.packageName) }) {
                          Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = isChecked, onCheckedChange = { c -> BoosterState.setSelectedPackages(if (c) selectedPackages + app.packageName else selectedPackages - app.packageName) })
                              Column(modifier = Modifier.padding(start = 6.dp)) {
                                  Text(text = app.appName, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                                  Text(text = app.packageName, color = Color(0xFF64748B), fontSize = 11.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RamMetricRow(label: String, value: String, color: Color) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Text(text = label, color = Color(0xFF94A3B8), fontSize = 12.sp, modifier = Modifier.width(105.dp))
                  Text(text = value, color = color, fontSize = 14.sp, fontWeight = FontWeight.Bold)
              }
          }

          suspend fun runAutomatedHibernation(context: Context, packagesToKill: List<String>, returnToApp: Boolean) {
              val beforeAvail = readRealHardwareRam(context).availRealMb
              BoosterState.setHibernating(true)
              var count = 0
              for (pkg in packagesToKill) {
                  count++
                  BoosterState.stepCompletedForCurrentApp = false
                  BoosterState.clickedForceStopWaitingDialog = false
                  BoosterState.setStatus("Hibernando ($count/${packagesToKill.size}): $pkg")
                  try { context.startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply { data = Uri.fromParts("package", pkg, null); addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP) }) } catch (_: Exception) { continue }
                  var waitedMs = 0
                  while (!BoosterState.stepCompletedForCurrentApp && waitedMs < 2400) { delay(120L); waitedMs += 120 }
                  delay(180L)
              }
              BoosterState.setHibernating(false)
              executeDeepRamClean(context)
              if (returnToApp) {
                  try { context.startActivity(Intent(context, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP) }) } catch (_: Exception) {}
              }
              delay(400L)
              val afterAvail = readRealHardwareRam(context).availRealMb
              BoosterState.recordCycle((afterAvail - beforeAvail).coerceAtLeast(0L), packagesToKill.size)
          }

          fun isAccessibilityServiceEnabled(context: Context): Boolean {
              val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              return enabledServices.contains(context.packageName)
          }

          fun toggleForegroundService(context: Context, start: Boolean) {
              val intent = Intent(context, AutoBoosterService::class.java).apply { action = if (start) AutoBoosterService.ACTION_START else AutoBoosterService.ACTION_STOP }
              if (start) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent) else context.startService(intent)
              } else context.startService(intent)
          }

          fun readRealHardwareRam(context: Context): RealHardwareRam {
              val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val memInfo = ActivityManager.MemoryInfo()
              am.getMemoryInfo(memInfo)
              var memFreeKb = 0L; var buffersKb = 0L; var cachedKb = 0L
              try {
                  val reader = RandomAccessFile("/proc/meminfo", "r")
                  var line: String?
                  while (reader.readLine().also { line = it } != null) {
                      val parts = line!!.trim().split("\\s+".toRegex())
                      if (parts.size >= 2) {
                          val value = parts[1].toLongOrNull() ?: 0L
                          when (parts[0]) { "MemFree:" -> memFreeKb = value; "Buffers:" -> buffersKb = value; "Cached:" -> cachedKb = value }
                      }
                  }
                  reader.close()
              } catch (_: Exception) {}
              val totalRealMb = memInfo.totalMem / (1024 * 1024)
              val availRealMb = memInfo.availMem / (1024 * 1024)
              val usedActiveMb = totalRealMb - availRealMb
              val freeRawMb = if (memFreeKb > 0) memFreeKb / 1024 else availRealMb / 2
              val cachedMb = if (cachedKb + buffersKb > 0) (cachedKb + buffersKb) / 1024 else (availRealMb - freeRawMb).coerceAtLeast(0L)
              val usedWithCacheMb = (totalRealMb - freeRawMb).coerceIn(usedActiveMb, totalRealMb)
              val commercialGb = when { totalRealMb > 12500 -> 16; totalRealMb > 8500 -> 12; totalRealMb > 6200 -> 8; totalRealMb > 4200 -> 6; totalRealMb > 2200 -> 4; else -> 2 }
              return RealHardwareRam(commercialGb, totalRealMb, usedActiveMb, availRealMb, usedWithCacheMb, cachedMb, freeRawMb)
          }

          suspend fun executeDeepRamClean(context: Context): Int = withContext(Dispatchers.IO) {
              try { context.cacheDir?.deleteRecursively(); context.externalCacheDirs?.forEach { it?.deleteRecursively() } } catch (_: Exception) {}
              val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val pm = context.packageManager
              var count = 0
              for (app in pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                  if ((app.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && app.packageName != context.packageName) {
                      try { am.killBackgroundProcesses(app.packageName); count++ } catch (_: Exception) {}
                  }
              }
              Runtime.getRuntime().gc(); System.gc()
              return@withContext count
          }

          suspend fun loadUserInstalledApps(context: Context): List<AppProcessItem> = withContext(Dispatchers.IO) {
              val pm = context.packageManager
              val result = mutableListOf<AppProcessItem>()
              for (app in pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                  if ((app.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && app.packageName != context.packageName) {
                      result.add(AppProcessItem(pm.getApplicationLabel(app).toString(), app.packageName, (app.flags and ApplicationInfo.FLAG_STOPPED) == 0))
                  }
              }
              return@withContext result.sortedWith(compareByDescending<AppProcessItem> { it.isRunningOrHeavy }.thenBy { it.appName.lowercase() })
          }
