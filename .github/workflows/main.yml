      - name: 5. Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Compilar o APK v4.0 RAM Calc (Debug)
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RAM-Booster-Pro-v4-Calc.apk

      - name: 7. Disponibilizar RAM-Booster-Pro-v4-Calc.apk para Download
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Booster-Pro-v4-Calc-APK
          path: RAM-Booster-Pro-v4-Calc.apk
